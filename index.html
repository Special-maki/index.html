    <h1>市川市の魅力</h1>
    <p>ようこそ！千葉県市川市の紹介ページです。</p>

    <hr>

    <h2>1. 自然と歴史</h2>
    <p>市川市は都心に近接しながらも、豊かな自然と歴史的な場所が残っています。</p>
    <ul>
        <li>**真間川**: 桜の時期は特に美しいです。</li>
        <li>**里見公園**: 江戸川沿いにあり、昔の城跡でもあります。</li>
        <li>**真間山弘法寺**: 古いお寺で、文学作品にも登場します。</li>
    </ul>

    <h2>2. 交通の便</h2>
    <p>JR総武線、京成線、東京メトロ東西線など、複数の路線が利用可能で、都心へのアクセスが非常に便利です。</p>
    <p>主な駅: 市川駅、本八幡駅、行徳駅など。</p>

    <h2>3. 市川の風景</h2>
    <p>展望台からの眺めは最高！</p>
